name: Build iOS (Unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Expo
        uses: expo/expo-action@v4
        with:
          expo-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build unsigned xcarchive
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -1)
          echo "Found workspace: $WORKSPACE"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme sylab \
            -configuration Release \
            -archivePath build/sylab.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/sylab.xcarchive/Products/Applications/sylab.app Payload/
          zip -r sylab-unsigned.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: sylab-ios-unsigned
          path: sylab-unsigned.ipa
          retention-days: 30
